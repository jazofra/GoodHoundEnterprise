# GoodHound Enterprise configuration (all keys optional).
# Usage: goodhound-enterprise run -c examples/config.example.toml ...

# Path length cap. Hunter rejects variable-length traversals above 10.
max_hops = 10

# Target zone label. Tag_Tier_Zero is BloodHound Enterprise's Tier Zero.
# A custom Privilege Zone label can be used instead.
target_label = "Tag_Tier_Zero"

# Only start from groups/users in one domain (objectid prefix / domainsid).
# domain_sid = "S-1-5-21-1004336348-1177238915-682003330"

# Also look for paths individual users hold outside their group memberships.
# This costs one query per enabled user, so it is slow on large tenants.
include_users = false

# Risk model: "probability" (default) or "goodhound" (the original cost formula).
# See docs/RISK_MODEL.md for the formulas and the default probabilities.
risk_model = "probability"

# Chance that each attacker action (any hop except MemberOf/Contains/GPLink) is
# detected and stopped. Raise it for a strong SOC; 0 disables it.
per_action_detection = 0.05

# A session's probability halves every N days since BloodHound last saw it (0 = off).
session_half_life_days = 14

# Fetch every equally short path (allShortestPaths) so alternative routes raise
# the reach probability. Falls back to shortestPath automatically if rejected.
all_shortest_paths = true

# Let intermediate groups reuse another group's path: fewer queries, but their
# reach can be underestimated.
reuse_suffixes = false

# Join paths longer than the hop limit: a start node without a path is connected to
# the groups it reaches that have one. One extra query per start node without a path.
stitch = true

# Also traverse OpenGraph extension edges, by relationship-kind prefix. The traversable
# kinds are read from the tenant's Hunter capability catalog at the start of the run.
# opengraph = ["CyberArk", "MSSQL"]

# Chance of getting a CyberArk dual-control password release approved without already
# controlling an approver. Shared by every account in the same safe.
dual_control_probability = 0.25

# Throughput. Hunter's documented shared limit is 55 requests/s per client IP.
concurrency = 4
rate_limit = 10.0

# Cost of edges that are not listed below.
default_cost = 1

# Set to true to use ONLY the edges listed in [edges].
replace_default_edges = false

# Per-edge exploit cost. Every key is a traversable relationship kind used in
# the shortest-path queries. Add new BloodHound edge kinds here as they ship.
[edges]
HasSession = 3
CanRDP = 0          # GoodHound's value; raise it if RDP is hard to abuse in your estate
# CoerceAndRelayNTLMToSMB = 3
# SyncedToEntraUser = 1

# Cost overrides that depend on the target node kind ("Edge->TargetKind").
[targeted_edges]
"GenericAll->Domain" = 2

# Success probability per relationship kind (0-1), before session ageing and
# detection. Unlisted kinds use default_probability (0.7).
[edge_probability]
HasSession = 0.6    # 0.3 if Credential Guard / Protected Users are everywhere
CanRDP = 0.4        # non-admin RDP still needs local privilege escalation
# WriteSPN = 0.5    # depends on password strength of the target account

# Probability overrides that depend on the target node kind ("Edge->TargetKind").
[targeted_edge_probability]
# "GenericAll->Domain" = 0.8
