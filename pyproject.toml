[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goodhound-enterprise"
dynamic = ["version"]
description = "GoodHound-style busiest-path and weakest-link prioritisation for BloodHound Enterprise, via the Hunter MCP server (or the BHE REST API)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
fleet = ["anthropic>=2.6,<3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "anthropic>=2.6,<3"]

[project.scripts]
goodhound-enterprise = "goodhound_enterprise.cli:main"

[tool.setuptools.packages.find]
include = ["goodhound_enterprise*"]

[tool.setuptools.dynamic]
version = { attr = "goodhound_enterprise.__version__" }

[tool.mypy]
python_version = "3.11"
files = ["goodhound_enterprise"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]

[tool.ruff.lint.per-file-ignores]
"goodhound_enterprise/report.py" = ["E501"]  # embedded HTML/CSS template
"goodhound_enterprise/fleet/report.py" = ["E501"]  # embedded HTML template
